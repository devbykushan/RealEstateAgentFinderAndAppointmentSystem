<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Choose Your Role</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .gradient-custom {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        }
        .btn-primary {
            background-color: #4361ee;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
        }
        .btn-custom:hover {
            background-color: #1a5fd3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .welcome-card {
            border-radius: 12px;
            border: 1px solid #dee2e6;
            transition: all 0.2s;
            display: block;
            text-decoration: none;
            color: inherit;
        }
        .welcome-card:hover {
            border-color: #0d6efd;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
            text-decoration: none;
        }
        .divider {
            height: 1px;
            background-color: #e9ecef;
        }
    </style>
</head>
<body class="gradient-custom vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <div class="card-body text-center">
                    <h1 class="h3 mb-3">Welcome</h1>
                    <p class="text-muted mb-4">How do you plan to use the service?</p>

                    <a href="UserLogin.jsp" class="welcome-card d-block p-3 mb-3">
                        <div class="option-title fw-bold mb-1">I'm an User</div>
                        <div class="option-description text-muted small">Would like to find some best rated agents</div>
                    </a>

                    <a href="AgentLogin.jsp" class="welcome-card d-block p-3 mb-4">
                        <div class="option-title fw-bold mb-1">I'm an Agent</div>
                        <div class="option-description text-muted small">Would like to find customers to sell my properties</div>
                    </a>

                    <div class="divider my-3"></div>

                    <a href="index.jsp" class="btn btn-primary btn-custom w-100">
                        ← Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
